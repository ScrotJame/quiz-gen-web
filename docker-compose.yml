services:
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: quiz_backend
    restart: unless-stopped
    env_file:
      - ./back-end/.env.production   # bạn tự tạo từ .env.production.example
    ports:
      - "8000:8000"
    networks:
      - quiz_net

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        # URL mà trình duyệt dùng để gọi API (public)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: quiz_frontend
    restart: unless-stopped
    environment:
      - HOSTNAME=0.0.0.0
      - INTERNAL_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - quiz_net

networks:
  quiz_net:
    driver: bridge
