# ==============================================================================
# PRODUCTION DOCKER COMPOSE CONFIGURATION
# ==============================================================================
# Triển khai ứng dụng Quiz Web.
# Kết nối trực tiếp tới PostgreSQL đang chạy trên máy chủ host qua 'host.docker.internal:5432'.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. BACKEND: FastAPI Service (Production Mode)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: quiz_backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_NAME: "${APP_NAME:-Quiz Web Backend}"
      APP_ENV: "production"
      APP_PORT: "8000"
      APP_HOST: "0.0.0.0"
      LOG_LEVEL: "${LOG_LEVEL:-WARNING}"
      # Kết nối tới PostgreSQL đang chạy trên máy chủ host
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required in .env}"
      DB_ECHO: "false"
      DB_POOL_SIZE: "20"
      DB_MAX_OVERFLOW: "10"
      USE_IN_MEMORY_REPOS: "false"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      GEMINI_OCR_MODEL: "${GEMINI_OCR_MODEL:-gemini-3.5-flash-lite}"
      GEMINI_TEMPERATURE: "${GEMINI_TEMPERATURE:-0.3}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      MISTRAL_MODEL: "${MISTRAL_MODEL:-ministral-14b-2512}"
      MAX_UPLOAD_SIZE_MB: "${MAX_UPLOAD_SIZE_MB:-10}"
      LOCAL_OCR_ENABLED: "${LOCAL_OCR_ENABLED:-true}"
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - quiz_net

  # ----------------------------------------------------------------------------
  # 2. FRONTEND: Next.js Standalone Runner (Production Mode)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: quiz_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - INTERNAL_API_URL=http://backend:8000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "3000:3000"
    networks:
      - quiz_net

  # ----------------------------------------------------------------------------
  # 3. CLOUDFLARE TUNNEL (Tùy chọn: chạy khi dùng --profile tunnel)
  # ----------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: quiz_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend
      - backend
    networks:
      - quiz_net
    profiles:
      - tunnel

networks:
  quiz_net:
    driver: bridge
